name: Build

on:
  push:
    branches: ["Production"]
  pull_request:
    branches: ["Production"]
  workflow_dispatch:

# Cancel superseded runs for the same ref to save CI minutes.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both real deploy targets, so neither becomes a blind spot:
        #   3.12 -> runtime.txt (Streamlit Community Cloud)
        #   3.14 -> Dockerfile (the containers, since 1.10.33)
        # Testing only one of them is how the containers sat on 3.11 while every
        # plan document claimed 3.14. See requirements.txt for why pandas stops
        # at 2.3.3 rather than moving to 3.x.
        python-version: ["3.12", "3.14"]

    env:
      # Pages print ◇/emoji glyphs; force UTF-8 so stdout never crashes on CI.
      PYTHONIOENCODING: utf-8

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          # Both files, or the cache key misses the pytest pin and a dev-dep
          # change is served a stale wheel set.
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        # requirements-dev.txt, not requirements.txt: it starts with
        # `-r requirements.txt` and adds pytest. Installing only the runtime
        # deps is why the "Test suite" step below failed with
        # "No module named pytest" from the moment it was added — the step ran,
        # but the tool it invokes was never installed.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Test suite
        # Only py_compile ran here until 2026-08-22, so two tests stayed broken
        # for days without CI noticing. --no-cov because the coverage gate is a
        # local check against the full source tree, not a CI signal.
        run: python -m pytest -q --no-cov

      - name: Syntax-check (py_compile)
        run: |
          python -m py_compile app.py
          python -m py_compile pages/*.py
          find src -name '*.py' -print0 | xargs -0 python -m py_compile

  deploy:
    name: Deploy to Railway (production)
    needs: build
    if: github.ref == 'refs/heads/Production' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The `production` environment already exists in repo settings. Naming it
    # here is what exposes its secrets to this job - and lets a required
    # reviewer be added, so a merge cannot deploy unattended.
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write runtime secrets
        # Written on the runner only. .gitignore covers .streamlit/secrets*.toml,
        # so this file can never be committed, and .dockerignore keeps it out of
        # any image layer. The values live in GitHub, never in the repo.
        run: |
          mkdir -p .streamlit
          cat > .streamlit/secrets.toml <<'TOML'
          [database]
          url = "${{ secrets.DATABASE_URL }}"

          [api]
          FRED_API_KEY = "${{ secrets.FRED_API_KEY }}"
          FMP_API_KEY = "${{ secrets.FMP_API_KEY }}"
          FINNHUB_API_KEY = "${{ secrets.FINNHUB_API_KEY }}"

          [gmail]
          sender = "${{ secrets.GMAIL_SENDER }}"
          app_password = "${{ secrets.GMAIL_APP_PASSWORD }}"
          recipient = "${{ secrets.GMAIL_RECIPIENT }}"

          [telegram]
          bot_token = "${{ secrets.TELEGRAM_BOT_TOKEN }}"
          chat_id = "${{ secrets.TELEGRAM_CHAT_ID }}"
          TOML

      - name: Sanity-check the written config
        # Fails the deploy if a secret is missing, rather than shipping an app
        # that silently falls back to localhost:5432/trading.
        #
        # Reports EVERY secret, not just the first failure. The earlier version
        # printed two booleans and exited, so a run said only "DATABASE_URL is
        # empty" — which cannot distinguish one missing secret from the
        # environment not being wired up at all. Those need opposite fixes, and
        # the log is the only place to tell them apart.
        #
        # Presence only: True/False, never a value, never a length.
        run: |
          python - <<'PY'
          import tomllib, sys

          cfg = tomllib.load(open('.streamlit/secrets.toml', 'rb'))
          checks = [
              ("DATABASE_URL",       cfg.get("database", {}).get("url", ""),        True),
              ("FRED_API_KEY",       cfg.get("api", {}).get("FRED_API_KEY", ""),     False),
              ("FMP_API_KEY",        cfg.get("api", {}).get("FMP_API_KEY", ""),      False),
              ("FINNHUB_API_KEY",    cfg.get("api", {}).get("FINNHUB_API_KEY", ""),  False),
              ("GMAIL_SENDER",       cfg.get("gmail", {}).get("sender", ""),         False),
              ("GMAIL_APP_PASSWORD", cfg.get("gmail", {}).get("app_password", ""),   False),
              ("GMAIL_RECIPIENT",    cfg.get("gmail", {}).get("recipient", ""),      False),
              ("TELEGRAM_BOT_TOKEN", cfg.get("telegram", {}).get("bot_token", ""),   False),
              ("TELEGRAM_CHAT_ID",   str(cfg.get("telegram", {}).get("chat_id", "")), False),
          ]

          print("secret               present  required")
          print("-" * 42)
          for name, value, required in checks:
              print(f"{name:<20} {str(bool(value)):<8} {'yes' if required else 'no'}")

          present = sum(1 for _, v, _ in checks if v)
          missing_required = [n for n, v, r in checks if r and not v]
          print(f"\n{present}/{len(checks)} secrets present")

          if present == 0:
              sys.exit(
                  "\nEVERY secret is empty. That is not nine missing values - it is the "
                  "environment not reaching this job. Check Settings > Environments > "
                  "'production': the name must match `environment: production` exactly, "
                  "and its deployment-branch rule must allow Production.")
          if missing_required:
              sys.exit(f"\nrequired secret(s) empty: {missing_required} - refusing to deploy")
          PY

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --detach

  release:
    name: Publish GitHub Release
    # Behind the deploy, never beside it: a release advertising a version that
    # never reached Railway is worse than a stale Releases page.
    needs: deploy
    if: github.ref == 'refs/heads/Production' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      # The default GITHUB_TOKEN is read-only for contents; creating a tag
      # needs this, or the job 403s on a production merge.
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # --generate-notes diffs against the previous release, so the job
          # needs history rather than the default shallow clone.
          fetch-depth: 0

      - name: Read the version
        id: v
        # VERSION is the single source of truth that sync_version.py propagates.
        # Never type a version here - a hand-maintained copy is exactly the drift
        # this repo already fixed once for the footer and the image tag.
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          # Same grammar as deploy/sync_version.py's _SEMVER, prerelease suffix
          # included. A stricter rule here would reject a version the repo's own
          # validator accepts, breaking the pipeline on a legitimate bump.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$'; then
            echo "::error::VERSION is not semantic: '$VERSION'"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=ProductionV$VERSION" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
          VERSION: ${{ steps.v.outputs.version }}
        # Skip rather than fail when the tag exists: re-running a green workflow
        # and merging without a version bump both land here legitimately, and
        # neither is worth turning the pipeline red for.
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists - VERSION was not bumped, nothing to publish."
            exit 0
          fi
          # --draft=false explicitly: the 1.10.34 run produced a DRAFT, and a
          # draft creates no tag, so the Releases page showed the new version
          # while `git ls-remote --tags` still had only ProductionV1.0.1 - the
          # exact drift this job exists to end, but now behind a green check.
          gh release create "$TAG" \
            --title "Production V$VERSION" \
            --target "$GITHUB_SHA" \
            --draft=false \
            --generate-notes

      - name: Confirm it actually published
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.v.outputs.tag }}
        # The create step above can report success and still leave nothing
        # usable: a draft carries no tag. Assert the end state rather than
        # trusting the exit code - a green job that published nothing is worse
        # than a red one, because it looks handled.
        run: |
          STATE="$(gh release view "$TAG" --json isDraft,tagName --jq '.isDraft')"
          if [ "$STATE" != "false" ]; then
            echo "::error::$TAG exists but is a DRAFT - no tag was created. Publish it, or the Releases page will drift from VERSION again."
            exit 1
          fi
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG reports published but the tag is not on the remote."
            exit 1
          fi
          echo "::notice::Published $TAG (tag confirmed on origin)"
