
# Dashboard-Pro — app + PostgreSQL.
#
#   docker compose up --build         # build image, start db + app
#   open http://localhost:8501
#
# Configuration is passed via environment variables (the app reads every secret
# through src/core/secrets.py, which falls back to env vars — so no secrets.toml
# is baked into or mounted in the image). Put your API keys in a gitignored .env
# file next to this one; Compose loads it automatically:
#
#   FRED_API_KEY=...
#   FINNHUB_API_KEY=...
#   ANTHROPIC_API_KEY=...
#   POSTGRES_PASSWORD=change-me
#
# The Trade Journal's DB sidebar pre-fills from these env vars, so you just click
# "Connect & Load".

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql (version subdir),
      # not /var/lib/postgresql/data as in 16 and earlier.
      - pgdata:/var/lib/postgresql
    ports:
      # Exposed on the host for inspection (psql/GUI). Remove to keep DB internal.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-trading}"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: dashboard-pro:1.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      # Database — points the app at the `db` service (not localhost).
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-trading}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      # API keys — supplied from your .env (blank/optional if unset).
      FRED_API_KEY: ${FRED_API_KEY:-}
      FMP_API_KEY: ${FMP_API_KEY:-}
      FINNHUB_API_KEY: ${FINNHUB_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Gmail SMTP (AMD scanner / market-overview alerts) — optional.
      GMAIL_SENDER: ${GMAIL_SENDER:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      GMAIL_RECIPIENT: ${GMAIL_RECIPIENT:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

volumes:
  pgdata:
