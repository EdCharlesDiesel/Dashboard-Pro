
# Dashboard-Pro — app + PostgreSQL.
#
#   docker compose up --build         # build image, start db + app
#   open http://localhost:8501
#
# Configuration is passed via environment variables (the app reads every secret
# through src/core/secrets.py, which falls back to env vars — so no secrets.toml
# is baked into or mounted in the image). Values below are hardcoded per project
# decision (this repo's owner does not consider them sensitive) — no .env file
# is needed; `docker compose up` works standalone.
#
# The Trade Journal's DB sidebar pre-fills from these env vars, so you just click
# "Connect & Load".

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      # $$ escapes the literal $ so Compose doesn't treat it as variable interpolation.
      POSTGRES_PASSWORD: ""
      POSTGRES_DB: dashboardprov1
    volumes:
      # postgres:18+ stores data under /var/lib/postgresql (version subdir),
      # not /var/lib/postgresql/data as in 16 and earlier.
      - pgdata:/var/lib/postgresql
    ports:
      # Exposed on the host for inspection (psql/GUI). Remove to keep DB internal.
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dashboardprov1"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: dashboard-pro:1.0.1
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8501:8501"
    environment:
      # Database — points the app at the `db` service (not localhost).
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dashboardprov1
      DB_USER: postgres
      DB_PASSWORD: ""
      # API keys — real values, optional (app degrades gracefully without them).
      FRED_API_KEY: "b95428dde387943cd19ecac1cf71d38f"
      FMP_API_KEY: "BDIqvTLAhhi04dVyNeGG9xzSGQc5yDLQ"
      FINNHUB_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      # Gmail SMTP (AMD scanner / market-overview alerts) — optional, unset.
      GMAIL_SENDER: "Ckhotso@gmail.com"
      GMAIL_APP_PASSWORD: "dsqf gaoj gdfw pjvg"
      GMAIL_RECIPIENT: "Ckhotso@gmail.com"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  # data_backbone background refresher: warms the store on startup, then upserts
  # every watched ticker/FRED series daily (see src/data_backbone/worker.py).
  worker:
    build: .
    image: dashboard-pro:1.0.1
    restart: unless-stopped
    command: ["python", "-m", "src.data_backbone.worker"]
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: dashboardprov1
      DB_USER: postgres
      DB_PASSWORD: "$$ta99Ath0"
      FRED_API_KEY: "b95428dde387943cd19ecac1cf71d38f"

volumes:
  pgdata:
