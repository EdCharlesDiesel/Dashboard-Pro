# TLS overlay for the AWS deploy — adds an nginx reverse proxy (HTTPS +
# basic-auth) and a certbot renewal loop in front of the `ui` service.
#
# This is an *overlay*: run it together with the base file, so the worker + ui
# definitions aren't duplicated —
#
#   docker compose -f docker-compose.aws.yml -f docker-compose.aws-tls.yml up -d --build
#
# nginx reaches `ui:8501` over the compose network (the base file's localhost
# port binding is left as-is, harmless — the public entry point is now 443).
# See DEPLOY-AWS-TLS.md for DNS, certificate issuance, and the htpasswd file.

services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - ui
    ports:
      - "80:80"      # ACME challenge + HTTPS redirect
      - "443:443"    # the real entry point
    volumes:
      - ./deploy/nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - letsencrypt:/etc/letsencrypt:ro
      - certbot-webroot:/var/www/certbot:ro
    # Run nginx in the foreground AND reload every 6h so renewed certificates
    # are picked up without a manual restart.
    command: >-
      /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done &
      nginx -g "daemon off;"'

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - letsencrypt:/etc/letsencrypt
      - certbot-webroot:/var/www/certbot
    # Attempt renewal every 12h via the webroot nginx serves (the initial
    # certificate is issued once, manually — see DEPLOY-AWS-TLS.md).
    entrypoint: >-
      /bin/sh -c 'trap exit TERM; while :; do
      certbot renew --webroot -w /var/www/certbot --quiet;
      sleep 12h & wait $${!}; done'

volumes:
  letsencrypt:
  certbot-webroot:
