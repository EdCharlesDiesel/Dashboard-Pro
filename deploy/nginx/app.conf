# nginx reverse proxy for Dashboard-Pro (Streamlit) — TLS + basic-auth.
#
# Two server blocks:
#   :80  — serves the ACME (Let's Encrypt) challenge and redirects all else to
#          HTTPS.
#   :443 — terminates TLS, requires HTTP basic-auth (Streamlit authenticates
#          nobody on its own), and reverse-proxies to the `ui` container,
#          including the WebSocket upgrade Streamlit needs (_stcore/stream).
#
# ⚠️ Replace EVERY occurrence of `dashboard.example.com` below with your real
# domain (4 spots: two server_name, two ssl_certificate paths). See
# DEPLOY-AWS-TLS.md for issuing the certificate and the htpasswd file.

# ── HTTP: ACME challenge + redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name dashboard.example.com;

    # Let's Encrypt webroot challenge (certbot writes here; nginx serves it).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: TLS + basic-auth + reverse proxy to Streamlit ────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name dashboard.example.com;

    ssl_certificate     /etc/letsencrypt/live/dashboard.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dashboard.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Streamlit has no login — gate the whole app behind HTTP basic-auth.
    auth_basic           "Dashboard-Pro";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # Allow chart/statement uploads.
    client_max_body_size 50M;

    location / {
        proxy_pass http://ui:8501;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket upgrade — Streamlit's live channel (_stcore/stream) needs it,
        # or the app loads then hangs "connecting…".
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Streamlit keeps a long-lived socket open; don't cut it at 60s.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
