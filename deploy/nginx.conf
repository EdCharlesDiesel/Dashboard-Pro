# Reverse proxy: public :80 -> Streamlit on 127.0.0.1:8501.
# Install to /etc/nginx/sites-available/dashboard and symlink into sites-enabled.
# Replace YOUR_DOMAIN_OR_IP. For HTTPS, run: certbot --nginx -d YOUR_DOMAIN
server {
    listen 80;
    server_name YOUR_DOMAIN_OR_IP;

    # Streamlit uploads / data exports can be large.
    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:8501;
        proxy_http_version 1.1;

        # Streamlit runs over a WebSocket — these headers are required.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Long timeout so idle WebSockets aren't dropped.
        proxy_read_timeout 86400;
    }
}
