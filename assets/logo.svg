<svg xmlns="http://www.w3.org/2000/svg" width="216" height="50" viewBox="0 0 216 50" fill="none">
  <title>Dashboard Pro — Trading Terminal</title>
  <!-- Emblem: a bordered terminal cell holding three candlesticks -->
  <rect x="1" y="5" width="40" height="40" fill="#0f0f0f" stroke="#00ff41" stroke-width="1.5"/>
  <line x1="11" y1="14" x2="11" y2="40" stroke="#00ff41" stroke-width="1"/>
  <rect x="9" y="22" width="4" height="13" fill="#00ff41"/>
  <line x1="21" y1="10" x2="21" y2="40" stroke="#00ff66" stroke-width="1"/>
  <rect x="19" y="15" width="4" height="20" fill="#00ff66"/>
  <line x1="31" y1="18" x2="31" y2="40" stroke="#ff3344" stroke-width="1"/>
  <rect x="29" y="25" width="4" height="10" fill="#ff3344"/>
  <!-- Wordmark -->
  <text x="51" y="25" font-family="JetBrains Mono, Consolas, monospace" font-size="16" font-weight="700" letter-spacing="1" fill="#e6e6e6">DASHBOARD<tspan fill="#00ff41"> PRO</tspan></text>
  <text x="52" y="40" font-family="JetBrains Mono, Consolas, monospace" font-size="8.5" letter-spacing="2.5" fill="#9a9a9a">TRADING TERMINAL</text>
</svg>
